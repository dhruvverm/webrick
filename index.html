    <script>
      var d = document.documentElement
      d.classList.add('js', 'fonts-pending')
      window.__t0 = performance.now()
      // The intro curtain is the first paint. Page text stays hidden behind it until the preloaded fonts
      // are in (so the headline is laid out once, in the right font), capped at 2.5 s. 600 ms after that
      // the static curtain lifts (CSS); if the app has mounted by then it runs the same timing itself.
      var ready = false
      var fontsDone = function () {
        if (ready) return
        ready = true
        d.classList.remove('fonts-pending')
        setTimeout(function () { d.classList.add('intro-lift') }, 600)
      }
      if (document.fonts && document.fonts.load) {
        Promise.all([document.fonts.load('600 1em "Bricolage Grotesque"', 'Websites, Ads & Social Media That Bring Customers.'), document.fonts.load('400 1em Geist', 'Webrick is a digital marketing agency')]).then(fontsDone, fontsDone)
        setTimeout(fontsDone, 2500)
      } else fontsDone()
    </script>
