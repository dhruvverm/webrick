<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400;500;600&display=block" rel="stylesheet" />
<style>
  :root { --ink:#1c1915; --muted:#6f685c; --paper:#faf7f2; --accent:#c2543a; --wa:#25D366; }
  * { box-sizing:border-box; }
  body { margin:0; width:390px; height:844px; overflow:hidden; background:var(--paper); color:var(--ink); font-family:'Geist',sans-serif; }
  .d { font-family:'Bricolage Grotesque',sans-serif; font-variation-settings:'opsz' 96; font-weight:700; letter-spacing:-.03em; }
  .bar { background:var(--ink); color:#fff; font-size:11px; text-align:center; padding:6px; letter-spacing:.06em; text-transform:uppercase; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 18px 8px; }
  .brand { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:22px; letter-spacing:-.04em; }
  .ic { display:flex; gap:14px; font-size:16px; }
  .hero { margin:6px 18px 0; height:230px; border-radius:18px; overflow:hidden; position:relative; }
  .hero img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .hero .t { position:absolute; left:14px; bottom:14px; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.4); }
  .hero .t small { display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; opacity:.9; }
  .hero .t b { display:block; font-family:'Bricolage Grotesque',sans-serif; font-size:30px; line-height:1; letter-spacing:-.03em; margin-top:4px; }
  .hero .btn { position:absolute; right:14px; bottom:14px; background:#fff; color:var(--ink); font-size:12px; font-weight:600; padding:9px 12px; border-radius:999px; }
  .trust { display:flex; justify-content:space-between; margin:12px 18px 0; font-size:11.5px; color:var(--muted); }
  .trust b { color:var(--ink); font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 18px 0; }
  .card { background:#fff; border-radius:14px; overflow:hidden; border:1px solid rgba(28,25,21,.06); }
  .card img { width:100%; height:150px; object-fit:cover; object-position:top; display:block; }
  .card .b { padding:9px 10px 11px; }
  .card h3 { margin:0; font-size:13px; font-weight:600; }
  .card p { margin:3px 0 0; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
  .card p b { color:var(--ink); }
  .fab { position:absolute; right:16px; bottom:18px; width:54px; height:54px; border-radius:50%; background:var(--wa); display:grid; place-items:center; box-shadow:0 10px 24px rgba(37,211,102,.4); }
</style></head>
<body>
  <div class="bar">Free shipping all over India · COD available</div>
  <header><div class="brand">Nyra</div><div class="ic">🔍 ♡ 🛍</div></header>
  <div class="hero"><img src="./hero.jpg" alt=""><div class="t"><small>New drop · Friday</small><b>Everyday<br>dresses</b></div><span class="btn">Shop now</span></div>
  <div class="trust"><span><b>4.9 ★</b> 1,240 reviews</span><span><b>UPI · COD</b></span><span><b>7-day</b> exchange</span></div>
  <div class="grid">
    <div class="card"><img src="./look1.jpg" alt=""><div class="b"><h3>Terracotta shirt dress</h3><p><span>S · M · L</span><b>₹1,499</b></p></div></div>
    <div class="card"><img src="./look2.jpg" alt=""><div class="b"><h3>Linen rope-belt dress</h3><p><span>S · M · L</span><b>₹1,299</b></p></div></div>
    <div class="card"><img src="./look4.jpg" alt=""><div class="b"><h3>Denim off-shoulder</h3><p><span>XS – L</span><b>₹1,199</b></p></div></div>
    <div class="card"><img src="./look3.jpg" alt=""><div class="b"><h3>Mustard tie-waist</h3><p><span>S · M · L</span><b>₹1,399</b></p></div></div>
  </div>

</body></html>
