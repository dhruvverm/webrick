<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Webrick first post</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  :root {
    --bg: #111110; --bone: #f2efe8; --accent: #e4632f; --accent-soft: #f0916b;
    --muted: #a7a297; --dim: #8a867d; --brick: #1c1c1a; --P: 90px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  .post {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: var(--bg); color: var(--bone); font-family: 'Geist', sans-serif;
  }
  .post.square { height: 1080px; }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(760px 560px at 86% 92%, rgba(228, 99, 47, 0.20), transparent 70%),
      radial-gradient(900px 700px at 8% 0%, rgba(242, 239, 232, 0.045), transparent 70%);
  }
  .mono { font-family: 'Geist Mono', monospace; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }

  .head { position: absolute; left: var(--P); right: var(--P); top: var(--P); display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { display: block; }
  .wordmark { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 38px; letter-spacing: -0.04em; line-height: 1; font-variation-settings: 'opsz' 96; }
  .head .mono { font-size: 24px; color: var(--dim); }

  .kicker { position: absolute; left: var(--P); top: 262px; display: flex; align-items: center; gap: 16px; font-size: 26px; color: var(--muted); }
  .kicker i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: block; }

  h1 {
    position: absolute; left: calc(var(--P) - 6px); top: 318px; margin: 0;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-variation-settings: 'opsz' 96;
    font-size: 226px; line-height: 0.9; letter-spacing: -0.012em;
  }
  h1 b { font-weight: inherit; color: var(--accent); }

  .lede { position: absolute; left: var(--P); top: 778px; width: 600px; margin: 0; font-size: 34px; line-height: 1.38; color: var(--muted); }
  .lede strong { color: var(--bone); font-weight: 500; }

  .foot { position: absolute; left: var(--P); top: 1030px; font-size: 26px; color: var(--bone); display: flex; align-items: center; gap: 18px; }
  .foot em { font-style: normal; color: var(--accent); }

  .brick { position: absolute; width: 168px; height: 70px; border-radius: 9px; background: var(--brick); box-shadow: inset 0 1px 0 rgba(242, 239, 232, 0.06), inset 0 -1px 0 rgba(0, 0, 0, 0.35); }
  .brick.bone { background: var(--bone); box-shadow: none; }
  .brick.accent { background: var(--accent); box-shadow: none; }
  .brick.slot { background: transparent; border: 2px dashed rgba(242, 239, 232, 0.22); box-shadow: none; }
  .brick.fly { background: var(--accent); box-shadow: 0 26px 50px rgba(0, 0, 0, 0.55), 0 0 70px rgba(228, 99, 47, 0.35); transform: rotate(-7deg); }
  .trail { position: absolute; width: 2px; border-radius: 2px; background: linear-gradient(to bottom, transparent, rgba(240, 145, 107, 0.7)); }

  .swipe { position: absolute; right: var(--P); top: 262px; color: var(--bone); font-size: 26px; display: none; align-items: center; gap: 16px; }
  .swipe span { color: var(--accent); font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; line-height: 0.6; }
  .carousel .swipe { display: flex; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="glow"></div>

  <div class="head">
    <div class="logo">
      <svg width="44" height="44" viewBox="0 0 40 40" id="mark"></svg>
      <span class="wordmark">Webrick</span>
    </div>
    <span class="mono" id="corner">Est. 2026 · India</span>
  </div>

  <div class="kicker mono"><i></i>Our first post</div>
  <h1>Hello,<br />world<b>.</b></h1>
  <p class="lede"><strong>We’re Webrick,</strong> a web and software studio from India. We build websites, web apps, online stores and custom CRMs, brick by brick.</p>

  <div class="foot mono">www.webrick.in <em>↗</em></div>
  <div class="swipe mono">Swipe <span>→</span></div>

  <div id="wall"></div>
</div>

<script>
  const q = new URLSearchParams(location.search)
  const post = document.getElementById('post')
  if (q.get('carousel')) { post.classList.add('carousel'); document.getElementById('corner').textContent = '01 / 04' }

  // brand mark
  const COLS = [2, 9.5, 17, 24.5, 32], ROWS = [5.75, 13.25, 20.75, 28.25]
  const BLOCKS = [[0,0],[4,0],[0,1],[2,1],[4,1],[0,2],[2,2],[4,2],[1,3,1],[3,3,1]]
  document.getElementById('mark').innerHTML = BLOCKS.map(([c, r, a]) =>
    `<rect x="${COLS[c]}" y="${ROWS[r]}" width="6" height="6" rx="0.8" fill="${a ? '#e4632f' : '#f2efe8'}"/>`).join('')

  // brick wall in running bond, rising towards the right, bleeding off the frame
  const BW = 168, BH = 70, GAP = 10, PX = BW + GAP, PY = BH + GAP, H = 1350, W = 1080
  // course 0 is the ground course; `from` is where each course begins (the wall climbs to the right)
  const FROM = [-Infinity, -Infinity, -Infinity, 540, 640, 730, 820, 910]
  const special = { '1:1': 'bone', '2:4': 'bone', '4:5': 'bone', '5:6': 'bone', '0:3': 'accent' }
  const wall = document.getElementById('wall')
  const topOf = (r) => 1290 - r * PY
  const first = {}
  FROM.forEach((from, r) => {
    const offset = r % 2 ? -PX / 2 : 0
    for (let c = -1; c < 8; c++) {
      const x = -34 + offset + c * PX
      if (x + BW < -10 || x > W + 10 || x < from) continue
      if (!(r in first)) first[r] = x
      const el = document.createElement('div')
      el.className = 'brick ' + (special[`${r}:${c}`] || '')
      el.style.left = x + 'px'; el.style.top = topOf(r) + 'px'
      wall.appendChild(el)
    }
  })

  // the next brick: an empty slot on the top course and the brick on its way down
  const topCourse = FROM.length - 1
  const slot = { x: first[topCourse] - PX, y: topOf(topCourse) }
  const add = (cls, x, y) => { const el = document.createElement('div'); el.className = cls; el.style.left = x + 'px'; el.style.top = y + 'px'; wall.appendChild(el); return el }
  add('brick slot', slot.x, slot.y)
  const fx = slot.x + 10, fy = slot.y - 150
  add('brick fly', fx, fy)
  ;[[30, 92, 64], [84, 118, 58], [138, 100, 62]].forEach(([dx, dy, h]) => {
    const t = add('trail', fx + dx + 8, fy - dy)
    t.style.height = h + 'px'; t.style.transform = 'rotate(-7deg)'
  })
  document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'))
</script>
</body>
</html>
