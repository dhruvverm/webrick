<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Webrick ad: 72 hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=block" rel="stylesheet" />
<link rel="stylesheet" href="ads.css" />
<script>
  const q=new URLSearchParams(location.search); if(q.get('sq')) document.documentElement.style.setProperty('--H','1080px'); document.documentElement.classList.toggle('sq',!!q.get('sq'))
  function mark(id,a,l){const C=[2,9.5,17,24.5,32],R=[5.75,13.25,20.75,28.25],B=[[0,0],[4,0],[0,1],[2,1],[4,1],[0,2],[2,2],[4,2],[1,3,1],[3,3,1]];document.getElementById(id).innerHTML=B.map(([c,r,x])=>`<rect x="${C[c]}" y="${R[r]}" width="6" height="6" rx="0.8" fill="${x?a:l}"/>`).join('')}
</script>

<style>
  body { background:var(--c1); }
  .post { background:var(--c1); color:var(--ink); }
  .post::before { content:''; position:absolute; inset:0; background:radial-gradient(700px 520px at 100% 100%, rgba(17,17,16,.28), transparent 70%); }
  .post > * { position:relative; }
  .big { margin-top:20px; display:flex; align-items:flex-end; gap:18px; }
  .big b { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:440px; line-height:.8; letter-spacing:-.06em; color:var(--bone); }
  .big span { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:96px; line-height:.9; letter-spacing:-.03em; padding-bottom:12px; }
  .big span small { display:block; font-family:'Geist',sans-serif; font-weight:500; font-size:34px; letter-spacing:0; margin-top:14px; max-width:420px; line-height:1.2; }
  .days { margin-top:40px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .day { background:rgba(17,17,16,.92); color:var(--bone); border-radius:20px; padding:22px 24px; }
  .day .mono { font-size:19px; color:var(--c2); }
  .day b { display:block; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:40px; letter-spacing:-.03em; margin-top:8px; }
  .day p { margin:8px 0 0; font-size:22px; color:var(--muted); line-height:1.3; }
  .sq .big b { font-size:330px; } .sq .big span { font-size:72px; } .sq .big span small { font-size:28px; } .sq .days { margin-top:24px; } .sq .day { padding:16px 20px; } .sq .day b { font-size:32px; } .sq .day p { font-size:20px; }
  .strip { background:var(--ink); color:var(--bone); }
</style></head><body>
<div class="post">
  <div class="head"><div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" id="m"></svg><span class="wordmark">Webrick</span></div><span class="mono">Web development · India</span></div>
  <div class="grow"></div>
  <div class="big"><b>72</b><span>hours.<small>From your brief to a live website.</small></span></div>
  <div class="days">
    <div class="day"><span class="mono">Day 1</span><b>Brief</b><p>Send your logo, photos and details on WhatsApp.</p></div>
    <div class="day"><span class="mono">Day 2</span><b>First look</b><p>You see the real site and ask for changes.</p></div>
    <div class="day"><span class="mono">Day 3</span><b>Live</b><p>Your website is online. Share the link.</p></div>
  </div>
  <div class="grow"></div>
  <div class="strip"><span>Fixed price from ₹3,999 · DM us</span><span class="mono">www.webrick.in</span></div>
</div>
<script>mark('m','#e4632f','#f2efe8')</script>
</body></html>
